<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Signup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      width: 350px;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
      color: #444;
    }

    input, select, button {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #45a049;
    }

    .error {
      color: red;
      font-size: 12px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Employee Signup</h2>
    <form action="FirstServ" method="post" onsubmit="return validateForm()">
      
      <label for="empid">Employee ID:</label>
      <input type="text" id="empid" name="empid" required>
      <div id="idError" class="error"></div>

      <label for="ename">Name:</label>
      <input type="text" id="ename" name="ename" required>
      <div id="nameError" class="error"></div>

      <label for="age">Age:</label>
      <input type="number" id="age" name="age" min="18" max="60" required>
      <div id="ageError" class="error"></div>

      <label for="salary">Salary:</label>
      <input type="number" id="salary" name="salary" required>
      <div id="salaryError" class="error"></div>

      <label for="design">Designation:</label>
      <select id="design" name="design" required>
        <option value="">-- Select --</option>
        <option value="Developer">Developer</option>
        <option value="Tester">Tester</option>
        <option value="Manager">Manager</option>
        <option value="HR">HR</option>
      </select>
      <div id="designError" class="error"></div>

      <button type="submit">Submit</button>
    </form>
  </div>

  <script>
    function validateForm() {
      let valid = true;

      // ID: only numbers
      let id = document.getElementById("empid").value;
      if (!/^[0-9]+$/.test(id)) {
        document.getElementById("idError").innerText = "Employee ID must contain only digits.";
        valid = false;
      } else {
        document.getElementById("idError").innerText = "";
      }

      // Name: only letters and spaces
      let name = document.getElementById("ename").value;
      if (!/^[A-Za-z ]+$/.test(name)) {
        document.getElementById("nameError").innerText = "Name must contain only alphabets.";
        valid = false;
      } else {
        document.getElementById("nameError").innerText = "";
      }

      // Age: between 18 and 60
      let age = document.getElementById("age").value;
      if (age < 18 || age > 60) {
        document.getElementById("ageError").innerText = "Age must be between 18 and 60.";
        valid = false;
      } else {
        document.getElementById("ageError").innerText = "";
      }

      // Salary: positive number only
      let salary = document.getElementById("salary").value;
      if (!/^[0-9]+$/.test(salary) || salary <= 0) {
        document.getElementById("salaryError").innerText = "Salary must be a positive number.";
        valid = false;
      } else {
        document.getElementById("salaryError").innerText = "";
      }

      // Designation: must select
      let design = document.getElementById("design").value;
      if (design === "") {
        document.getElementById("designError").innerText = "Please select a designation.";
        valid = false;
      } else {
        document.getElementById("designError").innerText = "";
      }

      return valid;
    }
  </script>
</body>
</html>
