<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bank Home</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      background: #fff;
      width: 420px;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      text-align: center;
    }
    h1 {
      margin: 0 0 18px;
      color: #333;
    }
    p {
      margin: 0 0 22px;
      color: #666;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .grid .full {
      grid-column: 1 / -1;
    }
    button {
      width: 100%;
      padding: 12px 10px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .05s ease, opacity .15s ease;
    }
    button:active { transform: translateY(1px); }
    .primary { background: #4CAF50; color: #fff; }
    .info    { background: #2196F3; color: #fff; }
    .warn    { background: #FF9800; color: #fff; }
    .danger  { background: #F44336; color: #fff; }
    .neutral { background: #607D8B; color: #fff; }
  </style>
</head>
<body>
<p id="msg" style="color:green; font-weight:bold; text-align:center;"></p>
<script>
  const params = new URLSearchParams(window.location.search);
  const msg = params.get("msg");
  if (msg) {
    document.getElementById("msg").textContent = msg;
  }
</script>

  <div class="card">
    <h1>Bank Dashboard</h1>
    <p>Select an action</p>

    <div class="grid">
      <!-- Create Account -->
      <form action="CreateA.html" method="get">
        <button type="submit" class="primary">Create Account</button>
      </form>

      <!-- Check Balance -->
      <form action="Cbal.html" method="get">
        <button type="submit" class="info">Check Balance</button>
      </form>

      <!-- Deposit -->
      <form action="Depo.html" method="get">
        <button type="submit" class="warn">Deposit</button>
      </form>

      <!-- Withdraw -->
      <form action="Withdraw.html" method="get">
        <button type="submit" class="neutral">Withdraw</button>
      </form>

      <!-- Delete Account -->
      <form action="DeleteA.html" method="get" class="full">
        <button type="submit" class="danger">Delete Account</button>
      </form>
    </div>
  </div>
</body>
</html>
