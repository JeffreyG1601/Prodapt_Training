# Server
server.port=9101
spring.application.name=career-crafter-backend

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/careercrafter?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT configuration
jwt.secret=ChangeThisSecretToASecureLongRandomValue!
jwt.expiration-ms=86400000  

# API versioning / base path for swagger
springdoc.api-docs.path=/api-docs

# Logging
logging.level.org.springframework=INFO
logging.level.com.careercrafter=DEBUG
